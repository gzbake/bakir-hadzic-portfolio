<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0B1424"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12D7E8"/>
      <stop offset="100%" stop-color="#8357FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>
  <!-- Nav bar mockup -->
  <rect x="40" y="30" width="720" height="48" rx="4" fill="#0F1A2E" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
  <rect x="60" y="48" width="80" height="12" rx="2" fill="url(#accent)" opacity="0.7"/>
  <rect x="580" y="48" width="60" height="12" rx="2" fill="rgba(148,163,184,0.2)"/>
  <rect x="660" y="48" width="60" height="12" rx="2" fill="rgba(148,163,184,0.2)"/>
  <!-- Hero area -->
  <rect x="40" y="110" width="400" height="24" rx="2" fill="rgba(148,163,184,0.15)"/>
  <rect x="40" y="150" width="320" height="16" rx="2" fill="rgba(148,163,184,0.1)"/>
  <rect x="40" y="180" width="280" height="16" rx="2" fill="rgba(148,163,184,0.08)"/>
  <!-- Product grid -->
  <rect x="40" y="240" width="220" height="220" rx="6" fill="#0F1A2E" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
  <rect x="280" y="240" width="220" height="220" rx="6" fill="#0F1A2E" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
  <rect x="520" y="240" width="220" height="220" rx="6" fill="#0F1A2E" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
  <!-- Product placeholders -->
  <rect x="70" y="280" width="160" height="120" rx="4" fill="rgba(18,215,232,0.08)"/>
  <rect x="310" y="280" width="160" height="120" rx="4" fill="rgba(131,87,255,0.08)"/>
  <rect x="550" y="280" width="160" height="120" rx="4" fill="rgba(56,123,255,0.08)"/>
  <rect x="70" y="420" width="100" height="10" rx="2" fill="rgba(148,163,184,0.15)"/>
  <rect x="310" y="420" width="100" height="10" rx="2" fill="rgba(148,163,184,0.15)"/>
  <rect x="550" y="420" width="100" height="10" rx="2" fill="rgba(148,163,184,0.15)"/>
  <!-- Label -->
  <text x="400" y="490" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(148,163,184,0.4)" letter-spacing="1">INAT BOSANSKI · HOMEPAGE PREVIEW</text>
</svg>
